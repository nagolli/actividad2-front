<div class="register-list-container">
    <div class="register-card">
        <span class="register-title">
            {{ mode === 'register' ? 'Registro de usuario' :
            mode === 'edit' ? 'Editar usuario' :
            'Datos mínimos' }}
        </span>

        <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="register-form">

            <!-- Email -->
            <div class="field">
                <label for="email">E-mail</label>
                <input id="email" type="email" pInputText formControlName="email" />
            </div>
            <small *ngIf="email.invalid && (email.dirty || email.touched)" class="p-error">
                El e-mail es obligatorio y debe ser válido.
            </small>

            <!-- Nombre -->
            <div class="field">
                <label for="nombre">Nombre</label>
                <input id="nombre" type="text" pInputText formControlName="nombre" />
            </div>
            <small *ngIf="nombre.invalid && (nombre.dirty || nombre.touched)" class="p-error">
                El nombre es obligatorio.
            </small>

            <!-- Apellidos -->
            <div class="field">
                <label for="apellidos">Apellidos</label>
                <input id="apellidos" type="text" pInputText formControlName="apellidos" />
            </div>
            <small *ngIf="apellidos.invalid && (apellidos.dirty || apellidos.touched)" class="p-error">
                Los apellidos son obligatorios.
            </small>

            <!-- Teléfono -->
            <div class="field">
                <label for="telefono">Teléfono</label>
                <input id="telefono" type="text" pInputText formControlName="telefono" />
            </div>
            <small *ngIf="telefono.invalid && (telefono.dirty || telefono.touched)" class="p-error">
                El teléfono es obligatorio.
            </small>

            <!-- Contraseña (solo en Registro y Edición) -->
            <div class="field" *ngIf="mode !== 'send'">
                <label for="password">Contraseña</label>

                <div class="password-wrapper">
                    <input id="password" [type]="showPassword ? 'text' : 'password'" pInputText
                        formControlName="password" />
                    <button type="button" pButton class="toggle-password" (click)="togglePassword()"
                        [icon]="showPassword ? 'pi pi-eye-slash' : 'pi pi-eye'">
                    </button>
                </div>
            </div>
            <small *ngIf="password.invalid && (password.dirty || password.touched)" class="p-error">
                La contraseña es obligatoria.
            </small>

            <!-- Módulo de direcciones -->
            <h4>Dirección</h4>
            <div class="address-card">

                <div class="address-fields">

                    <div class="field">
                        <label>Nombre</label>
                        <input pInputText formControlName="name" />
                    </div>

                    <div class="field">
                        <label>Calle</label>
                        <input pInputText formControlName="street" />
                    </div>

                    <div class="field">
                        <label>Número</label>
                        <input pInputText formControlName="number" />
                    </div>

                    <div class="field">
                        <label>Ciudad</label>
                        <input pInputText formControlName="city" />
                    </div>

                    <div class="field">
                        <label>Provincia</label>
                        <input pInputText formControlName="province" />
                    </div>

                    <div class="field">
                        <label>Código Postal</label>
                        <input pInputText formControlName="postalCode" />
                    </div>

                    <div class="field">
                        <label>País</label>
                        <input pInputText formControlName="country" />
                    </div>

                    <div class="field">
                        <label>Piso</label>
                        <input pInputText formControlName="floor" />
                    </div>

                    <div class="field">
                        <label>Puerta</label>
                        <input pInputText formControlName="door" />
                    </div>

                    <div class="field">
                        <label>Escalera</label>
                        <input pInputText formControlName="staircase" />
                    </div>

                </div>

            </div>

            <!-- Botones -->
            <div class="button-row">
                <button pButton type="submit" label="Validar" class="btn-other" [disabled]="userForm.invalid"></button>

                <button pButton type="button" label="Cancelar" class="btn-cancel" (click)="onCancel()"></button>
            </div>

        </form>
    </div>
</div>
