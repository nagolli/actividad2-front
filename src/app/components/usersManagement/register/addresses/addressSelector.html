<div class="address-list">

    <div *ngFor="let dir of addresses.controls; let i = index">
        <app-address-item [group]="dir" [index]="i" [canDelete]="mode !== 'send'" (delete)="removeAddress(i)">
        </app-address-item>
    </div>

</div>

<button pButton type="button" label="Añadir dirección" class="btn-other" (click)="addAddress()" *ngIf="mode !== 'send'">
</button>
